name: hn-monitor

# Watch the Show HN thread AND our open GitHub PRs; one alert digest.
# HN part activates by adding the HN_ITEM_ID variable after submitting.
# PR part runs always (uses the built-in token via gh CLI).

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [hn-followup]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: hn-monitor
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the state-commit rebase never hits shallow-clone edge cases

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure gh auth
        run: echo "${{ github.token }}" | gh auth login --with-token

      - name: Poll HN thread + GitHub PRs, alert digest
        env:
          HN_ITEM_ID: ${{ vars.HN_ITEM_ID }}
          GH_AUTHOR: ${{ github.repository_owner }}
          GH_TOKEN: ${{ github.token }}
          GH_EVENT_NAME: ${{ github.event_name }}
          FOLLOWUP: ${{ github.event_name == 'repository_dispatch' && '1' || '0' }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node hn-monitor.mjs --state state/hn-monitor.json

      # Race-safe: retries with rebase if the sweep (or a human push) landed on main
      # since checkout. Failing here is harmless to the product — next 10-min tick retries —
      # but we exit 1 so a stuck push pattern is visible in run history.
      - name: Commit monitor state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f state/hn-monitor.json ] || { echo "No state file yet (nothing polled)."; exit 0; }
          git add state/hn-monitor.json
          if git diff --cached --quiet; then
            echo "No state change."
            exit 0
          fi
          git commit -m "chore: hn monitor state"
          ok=0
          for i in 1 2 3; do
            if git fetch origin main && git rebase origin/main && git push origin HEAD:main; then
              ok=1; break
            fi
            echo "state-push attempt $i failed — rebasing on latest main and retrying…"
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          [ "$ok" = "1" ] || { echo "::warning::Could not push monitor state; next tick will retry."; exit 1; }
