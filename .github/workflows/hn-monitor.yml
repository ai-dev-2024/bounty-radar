name: hn-monitor

# Watch the Show HN thread; alert on new comments / score movement.
# Enable by adding the HN_ITEM_ID variable (repo → Settings → Variables → Actions)
# once the submission is live. Skips silently until then.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hn-monitor
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Poll HN thread & alert
        env:
          HN_ITEM_ID: ${{ vars.HN_ITEM_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$HN_ITEM_ID" ]; then
            echo "HN_ITEM_ID not set — add it after submitting to Show HN. Skipping."
            exit 0
          fi
          node hn-monitor.mjs --state state/hn-monitor.json

      - name: Commit monitor state (dedup across runs)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/hn-monitor.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: hn monitor state"
            git pull --rebase origin main
            git push
          else
            echo "No state change."
          fi
