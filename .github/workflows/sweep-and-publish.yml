name: sweep-and-publish

# Daily sweep of bounty/job/challenge sources, published to GitHub Pages.
# Also runs on demand via the "Run workflow" button.

on:
  schedule:
    - cron: "0 0,6,12,18 * * *" # every 6 hours
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # gh CLI is preinstalled on ubuntu runners; auth via the built-in token.
      - name: Configure gh auth
        run: echo "${{ github.token }}" | gh auth login --with-token

      - name: Sweep sources & build site
        run: node build-site.mjs feed.json site

      - name: Fire alerts for new high-score listings
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$DISCORD_WEBHOOK_URL" ] || [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            node notify.mjs feed.json --state state/alerts-state.json
          else
            echo "No webhook secrets configured — skipping alerts."
          fi

      - name: Commit alert state (dedup across runs)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/alerts-state.json
          git diff --cached --quiet || git commit -m "chore: update alert state"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
