name: sweep-and-publish

# Daily sweep of bounty/job/challenge sources, published to GitHub Pages.
# Also runs on demand via the "Run workflow" button.

on:
  schedule:
    - cron: "0 0,6,12,18 * * *" # every 6 hours
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the state-commit rebase never hits shallow-clone edge cases

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # gh CLI is preinstalled on ubuntu runners; auth via the built-in token.
      - name: Configure gh auth
        run: echo "${{ github.token }}" | gh auth login --with-token

      - name: Sweep sources & build site
        run: node build-site.mjs feed.json site
        env:
          GH_TOKEN: ${{ github.token }}
          HN_ITEM_ID: ${{ vars.HN_ITEM_ID }} # set after Show HN submission → footer link appears automatically

      # Shareable chart: momentum.svg → PNG (2x density) for the HN first comment
      # and social posts. Best-effort — a sharp install hiccup never blocks publish.
      - name: Render momentum.png
        run: |
          if [ -f site/momentum.svg ]; then
            npm install --no-save --no-fund --no-audit sharp@0.105.0 >/dev/null 2>&1 \
              && node render-chart.mjs site/momentum.svg site/momentum.png \
              || echo "::warning::momentum.png render skipped (sharp install/render failed)"
          else
            echo "No momentum.svg yet (chart appears once the HN thread exists)."
          fi

      - name: Upload momentum.png artifact
        if: hashFiles('site/momentum.png') != ''
        uses: actions/upload-artifact@v4
        with:
          name: momentum
          path: site/momentum.png

      - name: Fire alerts for new high-score listings
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$DISCORD_WEBHOOK_URL" ] || [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            node notify.mjs feed.json --state state/alerts-state.json
          else
            echo "No webhook secrets configured — skipping alerts."
          fi

      # Race-safe: another workflow or a human may have pushed to main meanwhile.
      # Retry with rebase, but NEVER fail the job over it — publishing matters more
      # than tracking state (a lost dedup state just means an alert may repeat once).
      - name: Commit tracking state (alert dedup + first_seen map)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/alerts-state.json state/listings-seen.json
          if git diff --cached --quiet; then
            echo "No tracking-state changes to commit."
            exit 0
          fi
          git commit -m "chore: update tracking state"
          ok=0
          for i in 1 2 3; do
            if git fetch origin main && git rebase origin/main && git push origin HEAD:main; then
              ok=1; break
            fi
            echo "state-push attempt $i failed — rebasing on latest main and retrying…"
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          if [ "$ok" != "1" ]; then
            echo "::warning::Could not push tracking state after 3 attempts. Sweep + publish continue; dedup state may repeat one alert."
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # Guaranteed monitor poll after every publish — cron ticks for hn-monitor are
      # best-effort on GitHub, but this dispatch always fires when the feed changes.
      - name: Trigger follow-up monitor poll
        if: success()
        run: gh api repos/${{ github.repository }}/dispatches -f event_type=hn-followup

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
